version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kingstown_postgres
    environment:
      POSTGRES_USER: kingstown
      POSTGRES_PASSWORD: kingstown_password
      POSTGRES_DB: kingstown_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingstown"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kingstown_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kingstown:kingstown_password@postgres:5432/kingstown_db
      POSTGRES_USER: kingstown
      POSTGRES_PASSWORD: kingstown_password
      POSTGRES_DB: kingstown_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://127.0.0.1:3001,http://127.0.0.1:3002
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
