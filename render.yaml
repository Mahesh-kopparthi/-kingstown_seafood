services:
  - type: web
    name: kingstown-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingstown-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://your-frontend-url.onrender.com,http://localhost:3001,http://localhost:3002

databases:
  - name: kingstown-db
    databaseName: kingstown_db
    user: kingstown
