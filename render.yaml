services:
  - type: web
    name: kingstown-seafood
    env: python
    plan: free
    rootDirectory: backend
    buildCommand: |
      cd .. && npm install && npm run build
      mkdir -p static
      cp -r ../dist/* static/
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingstown-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://kingstown-seafood.onrender.com,http://localhost:3001,http://localhost:3002
      - key: PYO3_USE_ABI3_FORWARD_COMPATIBILITY
        value: 1
databases:
  - name: kingstown-db
    databaseName: kingstown_db
    user: kingstown
